[project]
name = "lie-detector"
version = "0.1.0"
description = "Multimodal lie detection from synchronized video, audio and biosignals (ECG, respiration, GSR)"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
